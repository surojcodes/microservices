apiVersion: v1
kind: Service
metadata:
  name: bank-service
spec:
  selector:
    app: bank #matches pod label
  type: NodePort #expose service outside the cluster
  ports:
    - port: 4000 # Service port inside cluster / Other pods in the cluster can reach the Service at bank-service:4000
      targetPort: 4000 # Pod container port /The Service forwards the traffic to this port inside the pod container
      nodePort: 31001 # Port on the node / external port on Minikube node /External apps (Postman, browser) access the Service using <Minikube-IP>:31001


#       External App / Postman
#        (http://<Minikube-IP>:31001)
#                   │
#                   ▼
#         ┌─────────────────────┐
#         │   bank-service  │
#         │  type: NodePort     │
#         │  port: 4000         │  <-- cluster-internal port
#         │  nodePort: 31001    │  <-- exposed externally
#         │  targetPort: 4000   │  <-- forwards to pod container
#         └─────────────────────┘
#                   │
#                   ▼
#             bank-pod
#           ┌───────────────┐
#           │ Container App │
#           │ listens:4000  │
#           └───────────────┘

#How traffic flows
#
#1. Postman / Browser → Minikube IP + nodePort (31001)
#2. Service (bank-service) receives traffic on nodePort, maps it to targetPort
#3. Pod container receives traffic on containerPort (4000)
