type Account {
  accountNumber: String
  accountType: AccountType
  balance: Float
  accountStatus: AccountStatus
  createdAt: String
  accountNickname: String
  profile: Profile
}

input CreateAccountInput {
  accountType: AccountType!
  balance: Float
  userId: String!
  accountNickname: String
}

enum AccountType {
  SAVINGS
  CHECKING
}

enum AccountStatus {
  ACTIVE
  INACTIVE
}
