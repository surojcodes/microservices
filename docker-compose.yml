services:
  account:
    build: ./accounts
    image: account:1.0.0
    container_name: account
    environment:
      PORT: 3001 #inject this env var in account container
    ports:
      - "${ACCOUNT_HOST_PORT}:3001"
  customer:
    build: ./customer
    image: customer:1.0.0
    container_name: customer
    environment:
      PORT: 3000
    ports:
      - "${CUSTOMER_HOST_PORT}:3000"
  bank:
    build: ./bank
    image: bank:1.0.0
    container_name: bank
    environment:
      PORT: 4000
      ACCOUNT_API_HOST: account
      CUSTOMER_API_HOST: customer
    ports:
      - "${BANK_HOST_PORT}:4000"
    depends_on:
      - account
      - customer
