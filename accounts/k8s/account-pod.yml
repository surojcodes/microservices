apiVersion: v1
kind: Pod
metadata:
  name: account-pod
  labels:
    app: account
spec:
  containers:
    - name: account
      image: account:1.0.0
      imagePullPolicy: Never #only use local image
      ports:
        - containerPort: 3001
      env:
        - name: PORT
          value: "3001"
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "256Mi"
          cpu: "500m"
